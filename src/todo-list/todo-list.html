<div class="p-4 flex flex-col items-center border bg-white w-full rounded">
  <h2 class="mb-4">{{ todoStore.pendingTasksCount() }} things I have to do:</h2>

  <form
    class="mb-4 flex w-full flex-col gap-2"
    [formGroup]="taskForm"
    (submit)="submitTask()"
  >
    <label for="todoTitle" class="text-sm font-medium">Task title</label>
    <input
      id="todoTitle"
      type="text"
      class="rounded border p-2"
      formControlName="title"
    />

    <label for="todoPriority" class="text-sm font-medium">Priority</label>
    <select
      id="todoPriority"
      class="rounded border p-2"
      formControlName="priority"
    >
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>

    <button
      type="submit"
      class="rounded border bg-slate-100 p-2 hover:bg-slate-200 disabled:cursor-not-allowed disabled:bg-slate-50"
      [disabled]="taskForm.invalid"
    >
      Add task
    </button>
  </form>

  <div class="mb-4 flex gap-2">
    <button
      type="button"
      data-filter="all"
      class="rounded border px-3 py-1"
      [class.bg-slate-200]="todoStore.currentFilter() === 'all'"
      (click)="todoStore.setFilter('all')"
    >
      All
    </button>
    <button
      type="button"
      data-filter="completed"
      class="rounded border px-3 py-1"
      [class.bg-slate-200]="todoStore.currentFilter() === 'completed'"
      (click)="todoStore.setFilter('completed')"
    >
      Completed
    </button>
    <button
      type="button"
      data-filter="incomplete"
      class="rounded border px-3 py-1"
      [class.bg-slate-200]="todoStore.currentFilter() === 'incomplete'"
      (click)="todoStore.setFilter('incomplete')"
    >
      Incomplete
    </button>
  </div>

  <ul class="flex w-full flex-col justify-center gap-4 p-2" id="todoList">
    @for (task of todoStore.visibleTasks(); track task.id) {
      <li class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <input
            type="checkbox"
            class="hover:cursor-pointer"
            [id]="'task-' + task.id"
            [checked]="task.completed"
            (change)="todoStore.toggleTask(task.id)"
          />
          <label
            [for]="'task-' + task.id"
            class="hover:cursor-pointer"
            [class.line-through]="task.completed"
          >
            {{ task.title }} ({{ priorityLabels[task.priority] }})
          </label>
        </div>

        <button
          type="button"
          class="rounded border px-2 py-1 hover:bg-slate-100"
          (click)="todoStore.deleteTask(task.id)"
        >
          Eliminar
        </button>
      </li>
    } @empty {
      <li class="text-sm text-slate-500">No tasks yet</li>
    }
  </ul>
</div>
